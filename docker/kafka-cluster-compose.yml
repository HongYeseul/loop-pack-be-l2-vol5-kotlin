# 브로커 3대 KRaft 클러스터, 복제·장애 전환 확인용
# infra-compose.yml 의 kafka, kafka-ui 와 포트가 겹쳐서 둘 중 하나만 띄운다
name: kafka-cluster

x-kafka-env: &kafka-env
  KAFKA_KRAFT_CLUSTER_ID: pDDcTmmQSqC0CpcveZ5ggA # 세 노드가 같은 클러스터로 포맷되도록 고정
  KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
  KAFKA_CFG_PROCESS_ROLES: broker,controller
  KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:9093
  KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_CFG_MIN_INSYNC_REPLICAS: 2 # 한 대가 죽어도 acks=all 쓰기 유지
  KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 2

x-kafka-healthcheck: &kafka-healthcheck
  test: ["CMD", "bash", "-c", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 10

services:
  kafka-1:
    image: bitnamilegacy/kafka:3.5.1
    container_name: kafka-1
    ports:
      - "19092:19092"
    environment:
      <<: *kafka-env
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://localhost:19092
    volumes:
      - kafka-1-data:/bitnami/kafka
    healthcheck: *kafka-healthcheck

  kafka-2:
    image: bitnamilegacy/kafka:3.5.1
    container_name: kafka-2
    ports:
      - "19093:19092"
    environment:
      <<: *kafka-env
      KAFKA_CFG_NODE_ID: 2
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,PLAINTEXT_HOST://localhost:19093
    volumes:
      - kafka-2-data:/bitnami/kafka
    healthcheck: *kafka-healthcheck

  kafka-3:
    image: bitnamilegacy/kafka:3.5.1
    container_name: kafka-3
    ports:
      - "19094:19092"
    environment:
      <<: *kafka-env
      KAFKA_CFG_NODE_ID: 3
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,PLAINTEXT_HOST://localhost:19094
    volumes:
      - kafka-3-data:/bitnami/kafka
    healthcheck: *kafka-healthcheck

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "9099:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092

  kafka-init:
    image: bitnamilegacy/kafka:3.5.1
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in user-events product-events order-events order-events.DLT; do
          kafka-topics.sh --bootstrap-server kafka-1:9092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions 2 --replication-factor 3
          kafka-topics.sh --bootstrap-server kafka-1:9092 \
            --describe --topic "$$topic"
        done

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
